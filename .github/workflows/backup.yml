name: Nightly backup

# The project is on Supabase's free plan: no PITR, no managed backups.
# This workflow is the disaster plan for the only copy of one artist's
# business memory. RPO is up to 24h, accepted deliberately.
#
# It needs NO repository secrets. The job proves itself to the
# `backup-secrets` edge function with a GitHub OIDC token and receives
# the database URL and the R2 pair for the duration of the run
# (scripts/backup-credentials.mjs, supabase/functions/backup-secrets).
#
# It is deliberately NOT gated behind an "enabled" variable the way
# e2e.yml is: if the broker refuses or Vault is empty it fails red, and
# that is the point — a backup that skips itself quietly is the exact
# failure mode that loses the data. Never silence the job.
#
# Every run also RESTORES the dump it just took into a throwaway
# Postgres on the runner and diffs row counts against production. A
# backup that has never been restored is a hypothesis; this one is
# rehearsed nightly.
on:
  schedule:
    # 09:10 UTC — ~03:10 in Mexico City, after her day and off the hour
    # so it doesn't queue behind everyone else's midnight cron.
    - cron: "10 9 * * *"
  workflow_dispatch:
  # TEMPORARY test scaffold — removed once the leg is proven on a runner.
  push:
    branches: [claude/angus-urgent-fixes-ysb8bn]

# Two runs writing the same prefix would race the retention prune.
concurrency:
  group: nightly-backup
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  BACKUP_BROKER_URL: https://xbpvqvlomrnuxydyqyqj.supabase.co/functions/v1/backup-secrets

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The runner's bundled pg_dump can be older than the server, and
      # pg_dump refuses to dump a newer major version. Install the client
      # matching the server rather than hoping they agree.
      - name: Install pg_dump 17
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-17
          pg_dump --version

      - run: npm ci

      - name: Fetch credentials (OIDC → backup-secrets)
        run: node scripts/backup-credentials.mjs

      # The dump and the document bytes are one job on purpose: a
      # database that points at photos nobody copied is not a backup.
      - name: Dump and mirror to R2
        id: dump
        env:
          BACKUP_RETENTION_DAYS: "30"
        run: node scripts/backup-db.mjs

      - name: Restore drill
        id: drill
        run: node scripts/restore-drill.mjs

      - name: Record the outcome
        if: always()
        run: |
          node scripts/backup-credentials.mjs report \
            "${{ (steps.dump.outcome == 'success' && steps.drill.outcome == 'success') && 'success' || 'failure' }}" \
            '{"dump":"${{ steps.dump.outcome }}","drill":"${{ steps.drill.outcome }}","key":"${{ steps.dump.outputs.key }}","bytes":"${{ steps.dump.outputs.bytes }}","run":"${{ github.run_id }}"}'
