name: Protect main (one-shot)

# TEMPORARY. Creates the branch ruleset on `main` (docs/handoff.md §8)
# from a runner, because the agent sandbox is barred from writing to
# GitHub's rulesets API by egress policy. The admin token comes from
# Supabase Vault through the same OIDC broker the backup uses; it is
# deleted from Vault and this file is removed once the ruleset exists.
on:
  push:
    branches: [claude/angus-urgent-fixes-ysb8bn]

permissions:
  contents: write
  id-token: write

env:
  BACKUP_BROKER_URL: https://xbpvqvlomrnuxydyqyqj.supabase.co/functions/v1/backup-secrets

jobs:
  protect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch the admin token (OIDC → broker)
        run: node scripts/backup-credentials.mjs github_admin

      - name: Create the ruleset
        run: |
          set -euo pipefail
          body='{
            "name": "main",
            "target": "branch",
            "enforcement": "active",
            "bypass_actors": [],
            "conditions": {"ref_name": {"include": ["~DEFAULT_BRANCH"], "exclude": []}},
            "rules": [
              {"type": "deletion"},
              {"type": "non_fast_forward"},
              {"type": "pull_request", "parameters": {
                "required_approving_review_count": 0,
                "dismiss_stale_reviews_on_push": false,
                "require_code_owner_review": false,
                "require_last_push_approval": false,
                "required_review_thread_resolution": false,
                "allowed_merge_methods": ["merge", "squash", "rebase"]}},
              {"type": "required_status_checks", "parameters": {
                "strict_required_status_checks_policy": true,
                "required_status_checks": [{"context": "check"}]}}
            ]
          }'
          existing=$(curl -sf -H "Authorization: Bearer $GITHUB_ADMIN_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/cardiganapps-ui/Angus/rulesets | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const r=JSON.parse(s).find(x=>x.name==="main");console.log(r?r.id:"")})')
          if [ -n "$existing" ]; then
            echo "ruleset 'main' already exists (id $existing) — updating"
            curl -sf -X PUT -H "Authorization: Bearer $GITHUB_ADMIN_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
              "https://api.github.com/repos/cardiganapps-ui/Angus/rulesets/$existing" -d "$body" > ruleset.json
          else
            curl -sf -X POST -H "Authorization: Bearer $GITHUB_ADMIN_TOKEN" -H "Accept: application/vnd.github+json" -H "Content-Type: application/json" \
              https://api.github.com/repos/cardiganapps-ui/Angus/rulesets -d "$body" > ruleset.json
          fi
          node -e 'const r=require("./ruleset.json");console.log("ruleset", r.id, r.enforcement, r.rules.map(x=>x.type).join(","))'

      # A protection rule nobody has tried to violate is a claim, not a
      # control. Push an empty commit straight at main with the job's own
      # token and require that GitHub refuses it.
      - name: Verify by trying to break it
        run: |
          set -uo pipefail
          git config user.name "ruleset-probe"
          git config user.email "noreply@anthropic.com"
          git fetch origin main
          git checkout -q -b probe origin/main
          git commit -q --allow-empty -m "probe: this commit must be rejected by the main ruleset"
          if git push origin probe:main 2>push.log; then
            echo "✗ the push LANDED — the ruleset is not protecting main. Revert the empty commit by hand."
            cat push.log; exit 1
          fi
          cat push.log
          grep -qiE "protected|rule|GH013" push.log || { echo "✗ refused, but not by a ruleset"; exit 1; }
          echo "✓ direct push to main refused by the ruleset"
