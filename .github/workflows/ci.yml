name: CI

on:
  push:
    # Agent branches too: a gate that only runs on main and on PRs does
    # not guard the work while it is being written, which is when it is
    # cheapest to fix. A PR from such a branch runs twice; that is the
    # price of the branch being checked at all.
    branches: [main, "claude/**"]
  pull_request:

# A later push supersedes an in-flight run on the same branch.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # `build` ends with check:bundle, which fails if a server-only secret
      # (service-role key, management token) reached the browser bundle.
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://example.supabase.co
          VITE_SUPABASE_ANON_KEY: ci-placeholder
